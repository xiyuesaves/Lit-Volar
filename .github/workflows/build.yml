name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Restore VS Code test runtime
        uses: actions/cache@v6
        with:
          path: .vscode-test/vscode-*
          key: ${{ runner.os }}-vscode-1.90.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify extension
        run: xvfb-run -a pnpm verify

      - name: Prepare package metadata
        id: package
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        env:
          IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          node -e "const fs = require('node:fs'); const manifest = require('./package.json'); const tagVersion = process.env.GITHUB_REF_NAME.replace(/^v/, ''); if (process.env.IS_TAG === 'true' && tagVersion !== manifest.version) throw new Error('Tag version ' + tagVersion + ' does not match package.json version ' + manifest.version); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + manifest.version + '\nvsix=lit-volar-' + manifest.version + '.vsix\n');"

      - name: Package extension
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        run: pnpm exec vsce package --no-dependencies --out "${{ steps.package.outputs.vsix }}"

      - name: Upload VSIX
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: lit-volar-${{ github.sha }}
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14

      - name: Stage GitHub Release asset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: release-vsix-${{ github.sha }}
          path: '${{ steps.package.outputs.vsix }}'
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v7
        with:
          name: release-vsix-${{ github.sha }}

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" ./*.vsix --verify-tag --generate-notes --title "Lit Volar ${GITHUB_REF_NAME#v}" --repo "$GITHUB_REPOSITORY"
          fi
