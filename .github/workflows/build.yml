name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify, package, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Restore VS Code test runtime
        uses: actions/cache@v6
        with:
          path: .vscode-test/vscode-*
          key: ${{ runner.os }}-vscode-1.90.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify extension
        run: xvfb-run -a pnpm verify

      - name: Prepare Marketplace release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          VSCE_PUBLISHER: ${{ vars.VSCE_PUBLISHER }}
        run: |
          node -e "const fs = require('node:fs'); const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8')); const tagVersion = process.env.GITHUB_REF_NAME.slice(1); if (tagVersion !== manifest.version) throw new Error('Tag version ' + tagVersion + ' does not match package.json version ' + manifest.version); if (!process.env.VSCE_PUBLISHER) throw new Error('Repository variable VSCE_PUBLISHER is required'); manifest.publisher = process.env.VSCE_PUBLISHER; fs.writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n');"

      - name: Package extension
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        run: pnpm exec vsce package --no-dependencies

      - name: Upload VSIX
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: lit-volar-${{ github.sha }}
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14

      - name: Publish to Visual Studio Marketplace
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --packagePath "lit-volar-${GITHUB_REF_NAME#v}.vsix"
